name: 🐛 Bug Report
description: Report a reproducible bug in an open-source @xernerx/* package or Xernerx repository.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! For hosted **Xernerx Suite** web apps or **Virtue** bot issues, you can also report directly on **[info.xernerx.com/bugs](https://info.xernerx.com/bugs)**.
  - type: input
    id: package
    attributes:
      label: Package / Component & Version
      description: Which package, service, or app is affected, and what version are you running?
      placeholder: e.g. @xernerx/framework@1.1.3, Node.js v22.11.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet or step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Configure XernerxClient with ...
        2. Run command ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Error Logs / Stack Trace
      description: Paste any console output or TypeScript compiler errors here.
      render: shell
